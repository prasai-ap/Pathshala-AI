services:
  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pathshala-qdrant
    ports:
      - "6333:6333"
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:-pathshala-secret-key}
    volumes:
      - qdrant-storage:/qdrant/storage
    networks:
      - pathshala-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pathshala-backend
    ports:
      - "8000:8000"
    environment:
      - ENV=${ENV:-development}
      - QDRANT_URL=http://qdrant:6333
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8501}
      - LLM_MODEL=${LLM_MODEL:-gpt-3.5-turbo}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend:/app/backend
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - pathshala-network
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # Streamlit Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pathshala-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8000}
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend
    networks:
      - pathshala-network
    command: streamlit run frontend/app.py --server.port=8501 --server.address=0.0.0.0

networks:
  pathshala-network:
    driver: bridge

volumes:
  qdrant-storage:
