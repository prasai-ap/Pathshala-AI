services:
  backend:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir --timeout 120 -r requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - .:/app
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  frontend:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir --timeout 120 -r requirements-frontend.txt && streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501"
    volumes:
      - .:/app
    env_file:
      - .env.example
    ports:
      - "8501:8501"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
